stages:
  prepare:
    cmd: python -m src.data
    deps:
      - src/data.py
      - src/config.py
      - data/raw/pm25_raw.csv
    params:
      - data.timezone
      - prepare
    outs:
      - data/processed/pm25_hourly.parquet

  featurize:
    cmd: python -m src.features
    deps:
      - src/features.py
      - data/processed/pm25_hourly.parquet
    params:
      - featurize
    outs:
      - data/processed/features.parquet

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - src/evaluate.py
      - src/data.py
      - src/models/base.py
      - src/models/baseline.py
      - data/processed/pm25_hourly.parquet
    params:
      - forecast
    metrics:
      - reports/metrics.json:
          cache: false
    outs:
      - reports/baseline_details.json:
          cache: false
