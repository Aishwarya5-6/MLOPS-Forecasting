stages:
  prepare:
    cmd: python -m src.data
    deps:
      - src/data.py
      - src/config.py
      - data/raw/pm25_raw.csv
    params:
      - data.timezone
      - prepare
    outs:
      - data/processed/pm25_hourly.parquet

  prepare_station:
    foreach:
      Hyderabad: {out: data/processed/station_pm25_hourly.parquet}
      Delhi: {out: data/processed/station_delhi.parquet}
      Bengaluru: {out: data/processed/station_bengaluru.parquet}
      Chennai: {out: data/processed/station_chennai.parquet}
    do:
      cmd: python -m src.station --city ${key}
      deps:
        - src/station.py
        - src/data.py
        - data/raw/station/city_hour.csv
      params:
        - prepare
      outs:
        - ${item.out}

  featurize:
    cmd: python -m src.features
    deps:
      - src/features.py
      - data/processed/pm25_hourly.parquet
    params:
      - featurize
    outs:
      - data/processed/features.parquet

  evaluate:
    cmd: python -m src.evaluate
    deps:
      - src/evaluate.py
      - src/data.py
      - src/models/base.py
      - src/models/baseline.py
      - data/processed/pm25_hourly.parquet
    params:
      - forecast
    metrics:
      - reports/metrics.json:
          cache: false
    outs:
      - reports/baseline_details.json:
          cache: false

  # ---------------- promotion-policy study (docs/study-protocol.md) ----------------
  study_cache:
    foreach:
      cams: {data: data/processed/pm25_hourly.parquet}
      station: {data: data/processed/station_pm25_hourly.parquet}
      station_delhi: {data: data/processed/station_delhi.parquet}
      station_bengaluru: {data: data/processed/station_bengaluru.parquet}
      station_chennai: {data: data/processed/station_chennai.parquet}
    do:
      cmd: python -m src.study.cache --dataset ${key}
      deps:
        - ${item.data}
        - src/study/cache.py
        - src/models
        - src/features.py
        - src/train.py
        - configs
      params:
        - seed
        - forecast.horizon
        - study.datasets
        - study.replay_days
        - study.max_window_days
        - study.refit_every_days
        - study.candidates
        - study.dataset_candidates
        - study.lstm_threads
      outs:
        - data/study/${key}

  study_replay:
    foreach:
      cams: {cache: cams, data: data/processed/pm25_hourly.parquet}
      station: {cache: station, data: data/processed/station_pm25_hourly.parquet}
      station_nolstm: {cache: station, data: data/processed/station_pm25_hourly.parquet}
      station_delhi: {cache: station_delhi, data: data/processed/station_delhi.parquet}
      station_bengaluru: {cache: station_bengaluru, data: data/processed/station_bengaluru.parquet}
      station_chennai: {cache: station_chennai, data: data/processed/station_chennai.parquet}
    do:
      cmd: python -m src.study.replay --replay ${key}
      deps:
        - data/study/${item.cache}
        - ${item.data}
        - src/study/replay.py
        - src/study/policies.py
        - src/study/stats.py
        - src/promote.py
      params:
        - seed
        - study
      outs:
        - reports/study/${key}/results.json:
            cache: false
        - reports/study/${key}/summary.csv:
            cache: false

  study_figures:
    cmd: python -m src.study.figures
    deps:
      - reports/study
      - src/study/figures.py
    params:
      - study.windows
    outs:
      - paper/figures:
          cache: false
      - paper/numbers.tex:
          cache: false
