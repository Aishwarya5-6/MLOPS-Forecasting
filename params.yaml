# Shared settings DVC watches. Change a value here -> `dvc repro` reruns only affected stages.
seed: 42

data:
  source: open-meteo       # CAMS model estimates; swap to openaq-archive if station access works
  latitude: 17.385         # Hyderabad city centre
  longitude: 78.4867
  start_date: "2022-08-01" # Open-Meteo PM2.5 history for India starts around here
  location_id: null        # OpenAQ only: station ID
  parameter: pm25          # OpenAQ only
  raw_file: data/raw/pm25_raw.csv
  timezone: Asia/Kolkata

prepare:
  freq: h                  # hourly series
  min_value: 0.0           # readings <= this are invalid (PM2.5 can't be zero/negative)
  max_value: 999.0         # readings above this are sensor errors
  max_gap_hours: 6         # interpolate gaps up to this length; longer gaps stay missing

featurize:
  lags: [1, 2, 3, 6, 12, 24, 48, 168]   # hours (168 = same hour last week)
  rolling_windows: [6, 24, 168]         # hours; computed from past values only

forecast:
  horizon: 24              # predict the next 24 hours
  seasonal_period: 24      # daily cycle, used by seasonal-naive and SARIMA
  holdout_hours: 720       # last ~30 days kept aside for promote.py (Phase 5); starts at midnight
  n_folds: 5               # walk-forward folds, expanding training window
  fold_test_hours: 720     # each fold is scored on a 30-day test window...
  fold_step_hours: 1752    # ...and folds start 73 days apart, so 5 folds cover a full year of seasons
  origin_every_hours: 24   # inside a test window, forecast the next 24 h every day at midnight

# Promotion-policy study (paper). Protocol: docs/study-protocol.md. Fixed before results.
study:
  datasets:
    cams: data/processed/pm25_hourly.parquet
    station: data/processed/station_pm25_hourly.parquet
  replay_days: 365          # replay window = last 365 days of each dataset
  max_window_days: 30       # cache starts this many days before the replay (longest validation window)
  refit_every_days: 30      # every candidate is refit on all data before the refit time
  decide_every_days: 7      # one promotion decision a week, then a 7-day deployment week
  n_decisions: 52
  candidates:               # name -> model type + config (+ overrides), built with train.build_model
    snaive: {model: seasonal_naive, config: configs/seasonal_naive.yaml}
    sarima: {model: sarima, config: configs/sarima.yaml}
    xgb: {model: xgb, config: configs/xgb.yaml, set: {log_target: true}}
    xgb_tuned: {model: xgb, config: configs/xgb_tuned.yaml}
    lstm: {model: lstm, config: configs/lstm.yaml, set: {num_layers: 2}}
  derived:                  # equal-weight means of cached candidates (same as EnsembleModel)
    ensemble: [xgb_tuned, sarima]
  thresholds: [0.0, 0.01, 0.02, 0.05, 0.10]
  windows: [7, 14, 30]
  dm_alpha: 0.05
  min_valid_fraction: 0.5   # skip a decision if < 50% of validation hours have actuals
  init_window_days: 30      # initial champion = best on the 30 origins before the replay
  bootstrap_n: 2000
