# Optuna sweep for XGBoost (W&B Sweeps replacement). Run: python -m src.sweep sweeps/xgb.yaml
name: xgb-tpe
model: xgb
base_config: configs/xgb.yaml     # unspecified keys come from here
metric: rmse                      # mean over the 5 walk-forward folds
direction: minimize
n_trials: 40
sampler:
  type: tpe                       # Bayesian (Tree-structured Parzen Estimator)
  seed: 42
  n_startup_trials: 10            # random trials before TPE takes over
fixed:
  log_target: true                # Phase 3: clearly better, so not searched
search_space:
  max_depth:        {type: int,   low: 3,    high: 10}
  learning_rate:    {type: float, low: 0.01, high: 0.3,  log: true}
  n_estimators:     {type: int,   low: 100,  high: 1200, step: 100}
  min_child_weight: {type: float, low: 1,    high: 100,  log: true}
  subsample:        {type: float, low: 0.5,  high: 1.0}
  colsample_bytree: {type: float, low: 0.4,  high: 1.0}
